# Catalogue des champs de la chaudière Okofen Pellematic / KEBA Touch
# - measurements : colonnes des fichiers CSV (touch_YYYYMMDD.csv) → table measurements
# - parameters   : réglages lisibles/modifiables via l'API (index.cgi?action=get|set)
#   valeur affichée = valeur brute API / divisor ; level basic = écran réglages, expert = onglet avancé

version: 1
source: Généré depuis l'Excel « Traductions Valeurs chaudière.xlsx », l'interface web KEBA Touch V02.00j et l'API de la chaudière. Ce fichier
  peut être édité à la main.
groups:
  hc: Circuit de chauffage
  dhw: Eau chaude sanitaire
  boiler: Chaudière
  ignition: Allumage
  draft: Dépression
  flame: Régulation T flamme
  power: Combustion / puissance
  runon: Fin de combustion
  feed: Alimentation granulés
  level: Niveau / pesée
  cleaning: Ramonage
  pump: Pompe chaudière
  ash: Décendrage
  freshwater: Module eau fraîche
  wash: Rinçage
  system: Système
  general: Général
  modes: Modes de fonctionnement
measurements:
- column: outside_temp
  csv: "AT [°C]"
  type: temperature
  unit: °C
  api: "CAPPL:LOCAL.L_aussentemperatur_ist"
  labels:
    fr: T extérieure
    en: Outside Temperature
    de: Außentemperatur
  description: Température extérieure mesurée par la sonde extérieure.
- column: boiler_temp
  csv: "KT Ist [°C]"
  type: temperature
  unit: °C
  api: "CAPPL:FA[0].L_kesseltemperatur"
  labels:
    fr: T chaudière
    en: Boiler Temp
    de: Kesseltemperatur
  description: Température de l'eau dans la chaudière (vue du régulateur de chauffage).
- column: boiler_temp_set
  csv: "KT Soll [°C]"
  type: temperature
  unit: °C
  api: "CAPPL:FA[0].L_kesseltemperatur_soll_anzeige"
  labels:
    fr: T chaudière consigne
    en: Boiler Temp Set
    de: Kesseltemperatur Soll
  description: Température chaudière demandée par les circuits (max(T départ consigne + surélévation, T chaudière mini)). 8 °C = pas de demande.
- column: burner_request
  csv: BR
  type: bool
  api: "CAPPL:FA[0].L_br1"
  labels:
    fr: Demande brûleur
    en: Burner Contact
    de: Brennerkontakt
  description: "Contact BR1 : le régulateur demande de la chaleur au brûleur."
- column: hc1_flow_temp
  csv: "HK1 VL Ist[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:LOCAL.L_hk[0].vorlauftemp_ist"
  labels:
    fr: Chf1 T départ
    en: HC1 Flow Temp
    de: HK1 Vorlauftemperatur
  description: Température de départ mesurée du circuit de chauffage 1 (après vanne mélangeuse).
- column: hc1_flow_set
  csv: "HK1 VL Soll[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:LOCAL.L_hk[0].vorlauftemp_soll"
  labels:
    fr: Chf1 T départ consigne
    en: HC1 Flow Temp Set
    de: HK1 Vorlauftemperatur Soll
  description: Consigne de départ calculée par la loi d'eau. 8 °C = circuit à l'arrêt (limite de chauffe atteinte).
- column: hc1_room_temp
  csv: "HK1 RT Ist[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:LOCAL.L_hk[0].raumtemp_ist"
  labels:
    fr: Chf1 T ambiante
    en: HC1 Room Temp
    de: HK1 Raumtemperatur
  description: Température ambiante mesurée par la sonde d'ambiance du circuit 1.
- column: hc1_room_set
  csv: "HK1 RT Soll[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:LOCAL.L_hk[0].raumtemp_soll"
  labels:
    fr: Chf1 T ambiante consigne
    en: HC1 Room Temp Set
    de: HK1 Raumtemperatur Soll
  description: Consigne d'ambiance active (confort ou réduit selon le programme horaire).
- column: hc1_pump
  csv: HK1 Pumpe
  type: bool
  api: "CAPPL:LOCAL.L_hk[0].pumpe"
  labels:
    fr: Chf1 Pompe
    en: HC1 Pump
    de: HK1 Pumpe
  description: Circulateur du circuit de chauffage 1.
- column: dhw1_temp_on
  csv: "WW1 EinT Ist[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:LOCAL.L_ww[0].einschaltfuehler_ist"
  labels:
    fr: ECS1 T démarrage
    en: DHW1 On Temperature
    de: WW1 Ein Temperatur
  description: Température du ballon d'eau chaude au niveau de la sonde d'enclenchement.
- column: dhw1_temp_off
  csv: "WW1 AusT Ist[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:LOCAL.L_ww[0].ausschaltfuehler_ist"
  labels:
    fr: ECS1 T arrêt
    en: DHW1 Off Temperature
    de: WW1 Aus Temperatur
  description: Température du ballon au niveau de la sonde de coupure (identique à la sonde d'enclenchement s'il n'y a qu'une sonde).
- column: dhw1_set
  csv: "WW1 Soll[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:LOCAL.L_ww[0].temp_soll"
  labels:
    fr: ECS1 consigne
    en: DHW1 Set
    de: WW1 Soll
  description: Consigne ECS active (consigne ou T min ECS selon le programme horaire).
- column: dhw1_pump
  csv: WW1 Pumpe
  type: bool
  api: "CAPPL:LOCAL.L_ww[0].pumpe"
  labels:
    fr: ECS1 Pompe
    en: DHW1 Pump
    de: WW1 Pumpe
  description: "Pompe de charge du ballon ECS : à 1, la chaudière produit de l'eau chaude."
- column: feed_pump1
  csv: Zubrp1 Pumpe
  type: bool
  api: "CAPPL:LOCAL.L_zubrp[0].pumpe"
  labels:
    fr: Pompe de charge (zubringer)
    en: Feed Pump 1
    de: Zubringerpumpe 1
  description: Pompe de transfert/recirculation (Zubringerpumpe).
- column: pe1_boiler_temp
  csv: "PE1 KT[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:FA[0].L_kesseltemperatur"
  labels:
    fr: PE1 T chaudière
    en: PE1 Boiler Temp
    de: PE1 Kesseltemperatur
  description: Température chaudière mesurée par l'automate du brûleur Pellematic 1.
- column: pe1_flame_temp
  csv: "PE1 FRT Ist[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:FA[0].L_feuerraumtemperatur"
  labels:
    fr: PE1 T flamme
    en: PE1 Comb Chamber T
    de: PE1 Feuerraumtemperatur
  description: Température du foyer (chambre de combustion).
- column: pe1_flame_set
  csv: "PE1 FRT Soll[°C]"
  type: temperature
  unit: °C
  api: "CAPPL:FA[0].L_feuerraumtemperatur_soll"
  labels:
    fr: PE1 T flamme consigne
    en: PE1 Comb Chamber T Set
    de: PE1 Feuerraumtemperatur Soll
  description: Consigne de température de foyer (régulation de la modulation).
- column: pe1_auger_run
  csv: "PE1 Einschublaufzeit[zs]"
  type: duration_cs
  unit: cs
  api: "CAPPL:FA[0].L_einschublaufzeit"
  labels:
    fr: PE1 t alim
    en: PE1 Auger Run Time
    de: PE1 Einschubzeit
  description: "Durée de marche de la vis brûleur par impulsion (en centisecondes). Avec le temps de pause, donne le taux d'alimentation : c'est\
    \ la base du calcul de consommation."
- column: pe1_auger_pause
  csv: "PE1 Pausenzeit[zs]"
  type: duration_cs
  unit: cs
  api: "CAPPL:FA[0].L_pausenzeit"
  labels:
    fr: PE1 t pause
    en: PE1 Rest Time
    de: PE1 Pausenzeit
  description: Durée de pause de la vis brûleur entre deux impulsions (en centisecondes).
- column: pe1_fan
  csv: "PE1 Luefterdrehzahl[%]"
  type: percent
  unit: '%'
  api: "CAPPL:FA[0].L_luefterdrehzahl"
  labels:
    fr: PE1 vitesse V comb
    en: PE1 Burner Fan Speed
    de: PE1 Lüfter Drehzahl
  description: "Vitesse du ventilateur d'air de combustion : bon indicateur de la puissance de modulation."
- column: pe1_flue_fan
  csv: "PE1 Saugzugdrehzahl[%]"
  type: percent
  unit: '%'
  api: "CAPPL:FA[0].L_saugzugdrehzahl"
  labels:
    fr: PE1 vitesse V fumées
    en: PE1 Flue Gas Fan Speed
    de: PE1 Abgasgebläse Drehzahl
  description: Vitesse de l'extracteur de fumées.
- column: pe1_draft
  csv: "PE1 Unterdruck Ist[Pa]"
  type: pressure
  unit: Pa
  api: "CAPPL:FA[0].L_unterdruck"
  labels:
    fr: PE1 Dépression
    en: PE1 Negative Draft
    de: PE1 Unterdruck
  description: Dépression mesurée dans le foyer.
- column: pe1_draft_set
  csv: "PE1 Unterdruck Soll[Pa]"
  type: pressure
  unit: Pa
  api: "CAPPL:FA[0].unterdruck_sollwert"
  labels:
    fr: PE1 Dépression consigne
    en: PE1 Negative Draft Set
    de: PE1 Unterdruck Soll
  description: Consigne de dépression.
- column: pe1_status
  csv: PE1 Status
  type: enum
  api: "CAPPL:FA[0].L_kesselstatus"
  labels:
    fr: PE1 Etat chaudière
    en: PE1 Boiler Mode
    de: PE1 Kesselstatus
  description: Phase de fonctionnement du brûleur.
  options:
    fr:
      0: Fonctionnement permanent
      1: Démarrage
      2: Allumage
      3: Allumage stabilisé (softstart)
      4: Combustion
      5: Fin de combustion (post-ventilation)
      6: Arrêt
      7: Aspiration
      8: Défaut cendres
      9: Défaut granulés
      10: Commutation granulés
      11: Défaut
      97: Arrêt
      98: Arrêt
      99: Arrêt
      100: Arrêt
      101: Arrêt
    en:
      0: Permanent operation
      1: Start
      2: Ignition
      3: Softstart
      4: Heating full power
      5: Run on time
      6: 'Off'
      7: Suction
      8: Ash!
      9: Pellets!
      10: Pellet switch
      11: Fault
      99: 'Off'
    de:
      0: Dauerlauf
      1: Start
      2: Zündung
      3: Softstart
      4: Leistungsbrand
      5: Nachlauf
      6: Aus
      7: Saugen
      8: '! Asche !'
      9: '! Pellets !'
      10: Pell Switch
      11: Störung
      99: Aus
- column: pe1_motor_auger
  csv: PE1 Motor ES
  type: bool
  api: "CAPPL:FA[0].ausgang_motor[11]"
  labels:
    fr: PE1 Moteur vis brûleur
    en: PE1 Motor Delivery
    de: PE1 Motor Einschub
  description: Moteur de la vis d'alimentation du brûleur (Einschub).
- column: pe1_motor_silo
  csv: PE1 Motor RA
  type: bool
  api: "CAPPL:FA[0].ausgang_motor[8]"
  labels:
    fr: PE1 Moteur extraction silo
    en: PE1 Motor RA1
    de: PE1 Motor RA1
  description: "Moteur d'extraction du silo (Raumaustragung : vis sans fin silo → trémie)."
- column: pe1_motor_res1
  csv: PE1 Motor RES1
  type: bool
  api: "CAPPL:FA[0].ausgang_motor[3]"
  labels:
    fr: PE1 Moteur Rés1
    en: PE1 Motor Res1
    de: PE1 Motor Res1
  description: "Sortie moteur de réserve 1 (selon l'installation : trémie intermédiaire, 2e vis…)."
- column: pe1_motor_turbine
  csv: PE1 Motor TURBINE
  type: bool
  api: "CAPPL:FA[0].ausgang_motor[0]"
  labels:
    fr: PE1 Turbine
    en: PE1 Turbine
    de: PE1 Turbine
  description: Turbine d'aspiration (systèmes aspirés uniquement).
- column: pe1_motor_ignition
  csv: PE1 Motor ZUEND
  type: bool
  api: "CAPPL:FA[0].ausgang_motor[1]"
  labels:
    fr: PE1 Allumeur
    en: PE1 Ignition Stick
    de: PE1 Glühstab
  description: "Allumeur électrique (bougie) : à 1 lors d'un allumage à froid."
- column: pe1_pump_uw
  csv: "PE1 Motor UW[%]"
  type: percent
  unit: '%'
  api: "CAPPL:FA[0].L_drehzahl_uw_ist"
  labels:
    fr: PE1 vitesse pompe chaudière
    en: PE1 UW Speed
    de: PE1 Drehzahl UW
  description: Pompe de circulation chaudière (Umwälzpumpe).
- column: pe1_motor_ash
  csv: PE1 Motor AV
  type: bool
  api: "CAPPL:FA[0].ausgang_motor[2]"
  labels:
    fr: PE1 Moteur cendrier ext
    en: PE1 Motor Ash Box
    de: PE1 Motor Aschebox
  description: Vis de décendrage vers le cendrier extérieur.
- column: pe1_motor_res2
  csv: PE1 Motor RES2
  type: bool
  labels:
    fr: PE1 Moteur Rés2
    en: PE1 Motor Res2
    de: PE1 Motor Res2
  description: Sortie moteur de réserve 2.
- column: pe1_motor_ma
  csv: PE1 Motor MA
  type: bool
  labels:
    fr: PE1 Moteur électrovanne
    en: PE1 Motor MA
    de: PE1 Motor MA
  description: Électrovanne / moteur MA (rinçage échangeur selon modèle).
- column: pe1_motor_cleaning
  csv: PE1 Motor RM
  type: bool
  api: "CAPPL:FA[0].ausgang_motor[5]"
  labels:
    fr: PE1 Moteur ramonage
    en: PE1 Motor Cleaning Sys
    de: PE1 Motor Reinigung
  description: Moteur de nettoyage automatique de l'échangeur (ramonage).
- column: pe1_motor_sm
  csv: PE1 Motor SM
  type: bool
  labels:
    fr: PE1 Moteur SM
    en: PE1 Motor SM
    de: PE1 Motor SM
  description: Sortie SM (non documentée).
live:
- key: burner_starts
  name: "CAPPL:FA[0].L_brennerstarts"
  labels:
    fr: Démarrages brûleur
    en: Burner Starts
    de: Brennerstarts
- key: ignitions
  name: "CAPPL:FA[0].L_anzahl_zuendung"
  labels:
    fr: Nombre d'allumages
    en: Number of Ignitions
    de: Anzahl Zündungen
- key: burner_hours
  name: "CAPPL:FA[0].L_brennerlaufzeit_anzeige"
  labels:
    fr: Heures de fonctionnement brûleur
    en: Burner Run Time
    de: Brennerlaufzeit
  unit: h
- key: mean_run_minutes
  name: "CAPPL:FA[0].L_mittlere_laufzeit"
  labels:
    fr: Durée moyenne de fonctionnement
    en: Average Run Time
    de: Mittlere Laufzeit
  unit: min
- key: standby_hours
  name: "CAPPL:FA[0].L_sillstandszeit"
  labels:
    fr: Durée d'arrêt cumulée
    en: Down Time
    de: Stillstandszeit
  unit: h
- key: status
  name: "CAPPL:FA[0].L_kesselstatus"
  labels:
    fr: État chaudière
    en: Boiler Status
    de: Kesselstatus
- key: boiler_temp
  name: "CAPPL:FA[0].L_kesseltemperatur"
  labels:
    fr: T chaudière
    en: Boiler Temp
    de: Kesseltemperatur
  divisor: 10
  unit: °C
- key: outside_temp
  name: "CAPPL:LOCAL.L_aussentemperatur_ist"
  labels:
    fr: T extérieure
    en: Outside Temp
    de: Außentemperatur
  divisor: 10
  unit: °C
- key: hc1_room_temp
  name: "CAPPL:LOCAL.L_hk[0].raumtemp_ist"
  labels:
    fr: T ambiante
    en: Room Temp
    de: Raumtemperatur
  divisor: 10
  unit: °C
- key: hc1_flow_temp
  name: "CAPPL:LOCAL.L_hk[0].vorlauftemp_ist"
  labels:
    fr: T départ
    en: Flow Temp
    de: Vorlauftemperatur
  divisor: 10
  unit: °C
- key: hc1_flow_set
  name: "CAPPL:LOCAL.L_hk[0].vorlauftemp_soll"
  labels:
    fr: T départ consigne
    en: Flow Temp Set
    de: Vorlauftemperatur Soll
  divisor: 10
  unit: °C
- key: dhw1_temp
  name: "CAPPL:LOCAL.L_ww[0].einschaltfuehler_ist"
  labels:
    fr: T ECS
    en: DHW Temp
    de: Warmwassertemperatur
  divisor: 10
  unit: °C
- key: flame_temp
  name: "CAPPL:FA[0].L_feuerraumtemperatur"
  labels:
    fr: T flamme
    en: Comb. Chamber Temp
    de: Feuerraumtemperatur
  divisor: 10
  unit: °C
- key: fan
  name: "CAPPL:FA[0].L_luefterdrehzahl"
  labels:
    fr: Ventilateur combustion
    en: Burner Fan
    de: Lüfterdrehzahl
  unit: '%'
- key: hopper_full
  name: "CAPPL:FA[0].L_pelletsfuellstand"
  labels:
    fr: Niveau trémie
    en: Pellet Level
    de: Pelletsfüllstand
- key: touch_version
  name: "CAPPL:LOCAL.touch[0].version"
  labels:
    fr: Version Touch
    en: Touch Version
    de: Software Bedienteil
parameters:
- name: "CAPPL:FA[0].betriebsart_fa"
  group: modes
  type: enum
  labels:
    fr: Mode du brûleur
    en: Pellematic 1
    de: Pellematic 1
  short_fr: Mode PE
  options:
    0: Arrêt
    1: Auto
    2: Marche
  level: basic
  description: Mode du brûleur Pellematic.
  writable: true
- name: "CAPPL:LOCAL.anlage_betriebsart"
  group: modes
  type: enum
  labels:
    fr: Mode de l'installation
    en: Heating Plant
    de: Anlage
  short_fr: Mode
  options:
    0: Arrêt
    1: Auto
    2: ECS
  level: basic
  description: "Mode général de l'installation : Arrêt, Auto (chauffage + ECS) ou ECS seule (été)."
  writable: true
- name: "CAPPL:LOCAL.aussentemperatur_mittelungszeit"
  group: modes
  type: number
  unit: min
  min: 0.0
  max: 180.0
  decimals: 0
  labels:
    fr: Durée de moyennage de la T extérieure
    en: Outside Temperature – Time of Average
    de: Aussentemperatur – Mittelungszeit
  short_fr: Durée moy Text
  level: basic
  description: Durée de moyennage de la T extérieure utilisée pour les limites de chauffe.
  writable: true
- name: "CAPPL:LOCAL.hk[0].betriebsart[1]"
  group: modes
  type: enum
  labels:
    fr: Mode du circuit de chauffage
    en: HC 1
    de: Heizkreis 1
  short_fr: Mode Chauffage
  options:
    0: Arrêt
    1: Auto
    2: Confort
    3: Réduit
  level: basic
  description: "Mode du circuit de chauffage 1 (installation en Auto) : Arrêt, Auto (programme horaire), Confort permanent, Réduit permanent."
  writable: true
- name: "CAPPL:LOCAL.hk[0].raumtemp_absenken"
  group: modes
  type: temperature
  unit: °C
  divisor: 10
  min: 10.0
  max: 40.0
  labels:
    fr: Consigne ambiance réduit
    en: Room Temp Set Back
    de: Raumtemp Absenken
  short_fr: T amb réduit
  level: basic
  description: Consigne d'ambiance en période réduite (nuit/absence).
  writable: true
- name: "CAPPL:LOCAL.hk[0].raumtemp_heizen"
  group: modes
  type: temperature
  unit: °C
  divisor: 10
  min: 5.0
  max: 40.0
  labels:
    fr: Consigne ambiance confort
    en: Room Temp Heating
    de: Raumtemp Heizen
  short_fr: T amb Confort
  level: basic
  description: Consigne d'ambiance en période de confort. Chaque °C modifie la consigne de départ de (1 + pente) °C.
  writable: true
- name: "CAPPL:LOCAL.ke_temp_min"
  group: modes
  type: temperature
  unit: °C
  divisor: 10
  min: 20.0
  max: 95.0
  labels:
    fr: Température chaudière mini
    en: Boiler – Temperature Min
    de: Kessel – Temperatur Min
  short_fr: T Chaud min
  level: basic
  description: Température chaudière minimale demandée dès qu'un circuit chauffe (protection contre la condensation).
  writable: true
- name: "CAPPL:LOCAL.ww[0].betriebsart[1]"
  group: modes
  type: enum
  labels:
    fr: Mode eau chaude (installation en Auto)
    en: DHW 1
    de: Warmw 1
  short_fr: Mode
  options:
    0: Arrêt
    1: Auto
    2: Marche
  level: basic
  description: Mode ECS (installation en Auto).
  writable: true
- name: "CAPPL:LOCAL.ww[0].betriebsart[2]"
  group: modes
  type: enum
  labels:
    fr: Mode eau chaude (installation en ECS seule)
    en: DHW 1
    de: Warmw 1
  short_fr: Mode
  options:
    0: Arrêt
    1: Auto
    2: Marche
  level: basic
  description: Mode ECS (installation en ECS seule).
  writable: true
- name: "CAPPL:LOCAL.ww[0].einmal_aufbereiten"
  group: modes
  type: enum
  labels:
    fr: Charge d'eau chaude immédiate
    en: DHW Boost
    de: Einmal Aufbereiten
  short_fr: Dérogation ECS
  options:
    0: Arrêt
    1: Marche
  level: basic
  description: Charge ECS unique immédiate (dérogation).
  writable: true
- name: "CAPPL:LOCAL.ww[0].temp_absenken"
  group: modes
  type: temperature
  unit: °C
  divisor: 10
  min: 0.0
  max: 80.0
  labels:
    fr: "Eau chaude : température mini"
    en: Water Temp Min
    de: Wassertemp Min
  short_fr: T min ECS
  level: basic
  description: "Température ECS minimale hors plages horaires : le ballon est rechargé s'il descend sous cette valeur."
  writable: true
- name: "CAPPL:LOCAL.ww[0].temp_heizen"
  group: modes
  type: temperature
  unit: °C
  divisor: 10
  min: 0.0
  max: 80.0
  labels:
    fr: Consigne eau chaude
    en: Water Temp Set
    de: Wassertemp Soll
  short_fr: T ECS cons
  level: basic
  description: Consigne d'eau chaude pendant les plages horaires ECS. Recommandé ≥ 50 °C (légionelles).
  writable: true
- name: "CAPPL:FA[0].L_fehler_ruecksetzen"
  group: modes
  type: enum
  labels:
    fr: Reconnaître l'erreur
    en: Quit Malfunct
    de: Fehler Quittieren
  options:
    0: Arrêt
    1: Marche
  level: expert
  writable: false
  snapshot: false
- name: "CAPPL:LOCAL.frostschutz_min_aussentemp"
  group: modes
  type: temperature
  unit: °C
  divisor: 10
  min: -10.0
  max: 15.0
  labels:
    fr: Prot contre le gel – T de protection
    en: Frost Protection – Protection Temp
    de: Frostschutz – Schutztemperatur
  short_fr: T Protection
  level: expert
